<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mesalab — Login</title>
  <link rel="stylesheet" href="style.css">
 </head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand">Mesalab</h1>
      <nav class="nav"><a href="index.html" class="nav-link">Inicio</a></nav>
    </div>
  </header>

  <main>
    <section class="container" aria-labelledby="login-title">
      <h2 id="login-title">Iniciar sesión</h2>
      <p class="lead">Introduce tu correo y contraseña para acceder al sistema.</p>

      <form action="#" method="post" novalidate id="loginForm">
        <div id="loginMessage" class="form-message hidden" aria-live="polite"></div>
        <div class="form-row column">
          <div>
            <label for="email">Correo</label>
            <input id="email" name="email" type="email" placeholder="usuario@ejemplo.com" required>
          </div>

          <div>
            <label for="password">Clave</label>
            <input id="password" name="password" type="password" placeholder="********" required>
          </div>
        </div>

        <div class="actions">
          <button class="btn" type="submit">Entrar</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>¿No tienes cuenta? contacta con el administrador.</p>
    </div>
  </footer>
  <script src="main.js"></script>
</body>
</html>
